# Scan for Secrets — Prompt2PR Example Workflow
#
# Scans source files for accidentally committed secrets, tokens, or API keys.
# Runs daily at 3:00 UTC and can be triggered manually.
#
# Setup:
#   1. Copy this file to .github/workflows/scan-secrets.yml
#   2. Set your LLM provider API key as a GitHub Secret
#   3. Adjust the paths to exclude test fixtures or mock data

name: Scan Secrets

on:
  schedule:
    # Run daily at 3:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt (optional — overrides default)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Davphla/Prompt2PR@v1
        with:
          prompt: >-
            ${{ github.event.inputs.prompt || 'Scan all source files for
            accidentally committed secrets, API keys, tokens, passwords, or
            private keys. Look for patterns like hardcoded strings starting with
            "sk-", "ghp_", "AKIA", base64-encoded credentials, or connection
            strings with embedded passwords. For each finding, replace the value
            with an environment variable reference and add a comment explaining
            what secret was removed.' }}
          provider: 'mistral'
          paths: 'src/**,config/**,*.json,*.yml,*.yaml'
          max_files: 10
          max_changes: 100
          label: 'prompt2pr,security'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
