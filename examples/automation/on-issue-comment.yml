# On Issue Comment — Prompt2PR Example Workflow
#
# Triggers Prompt2PR when someone comments "/prompt2pr <instruction>"
# on an issue. The comment body becomes the prompt.
# Uses GitHub Models (no external API key needed).
#
# SECURITY WARNING — Prompt Injection Risk:
#   This workflow passes user-controlled input (issue comments) directly
#   to an LLM. Any user who can comment on issues can craft adversarial
#   prompts to manipulate the LLM output. Mitigations applied here:
#   - Restrict to org members / collaborators via the 'if' condition
#   - Narrow 'paths' scope to limit what the LLM can modify
#   - Use low 'max_files' / 'max_changes' limits to reduce blast radius
#   - Review every generated PR before merging
#
# Setup:
#   1. Copy this file to .github/workflows/on-issue-comment.yml
#   2. No API key needed — uses the built-in GITHUB_TOKEN
#   3. IMPORTANT: Adjust the membership check below to match your org/team

name: Prompt2PR on Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read
  models: read

jobs:
  prompt2pr:
    if: >-
      startsWith(github.event.comment.body, '/prompt2pr ') && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract prompt from comment
        id: extract
        run: |
          # Strip the /prompt2pr prefix and leading whitespace from the comment
          COMMENT_BODY="${{ github.event.comment.body }}"
          PROMPT="${COMMENT_BODY#/prompt2pr }"
          # Write to GITHUB_OUTPUT using a heredoc delimiter to handle
          # multi-line prompts safely
          {
            echo 'prompt<<PROMPT2PR_EOF'
            echo "$PROMPT"
            echo 'PROMPT2PR_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: davd-gzl/Prompt2PR@v1
        id: prompt2pr
        with:
          prompt: ${{ steps.extract.outputs.prompt }}
          provider: 'github'
          model: 'openai/gpt-4o'
          paths: 'src/**'
          max_files: 5
          max_changes: 100
          label: 'prompt2pr,from-comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
