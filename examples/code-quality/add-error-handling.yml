# Add Error Handling — Prompt2PR Example Workflow
#
# Scans source files for missing error handling and adds try/catch blocks,
# input validation, and descriptive error messages. Works well as a
# single-shot task for focused scopes — the LLM can spot unhandled
# promise rejections, missing null checks, and bare throws by reading
# the code structure.
#
# Note: The LLM cannot run your code to verify the changes compile or
# pass tests. Always review the generated PR and run your test suite
# before merging.
#
# Setup:
#   1. Copy this file to .github/workflows/add-error-handling.yml
#   2. Add MISTRAL_API_KEY as a GitHub Secret
#   3. Adjust the paths to match your source directories

name: Add Error Handling

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt (optional — overrides default)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  error-handling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: davd-gzl/Prompt2PR@v1
        with:
          prompt: >-
            ${{ github.event.inputs.prompt || 'Review source files for missing
            error handling. For each issue found: (1) Wrap unhandled async/await
            calls in try/catch blocks. (2) Add null/undefined checks for
            function parameters that are used without validation. (3) Replace
            bare "throw new Error()" with descriptive messages that include what
            operation failed and relevant variable values. Preserve existing
            behavior — only add defensive code.' }}
          provider: 'mistral'
          paths: 'src/**'
          max_files: 10
          max_changes: 200
          label: 'prompt2pr,error-handling'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
