# Enforce Style Guide — Prompt2PR Example Workflow
#
# Checks source files against a project style guide and fixes violations.
# Uses GitHub Models (no external API key needed).
# Runs on every push to main and can be triggered manually.
#
# Setup:
#   1. Copy this file to .github/workflows/enforce-style-guide.yml
#   2. No API key needed — uses the built-in GITHUB_TOKEN
#   3. Adjust the paths to match your source directories

name: Enforce Style Guide

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt (optional — overrides default)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  enforce-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: davd-gzl/Prompt2PR@v1
        with:
          prompt: >-
            ${{ github.event.inputs.prompt || 'Review all source files for style
            guide violations: ensure consistent naming conventions (camelCase
            for variables, PascalCase for classes/types), add missing JSDoc
            comments to exported functions, and replace magic numbers with named
            constants. Do not change any logic or behavior.' }}
          provider: 'github'
          model: 'openai/gpt-4o'
          paths: 'src/**'
          max_files: 10
          max_changes: 200
          label: 'prompt2pr,style'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
