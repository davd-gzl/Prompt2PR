# Cleanup TODOs — Prompt2PR Example Workflow
#
# Finds resolved or stale TODO/FIXME/HACK comments and cleans them up.
# The LLM reads the surrounding code to judge whether a TODO has been
# addressed. This works well as a single-shot task because the judgment
# is local — the LLM only needs the file context, not external state.
#
# Note: The LLM cannot check your issue tracker. If a TODO references
# an issue number, the LLM will only judge from the surrounding code
# whether the task appears complete.
#
# Setup:
#   1. Copy this file to .github/workflows/cleanup-todos.yml
#   2. Set your LLM provider API key as a GitHub Secret
#   3. Adjust the paths to match your source directories

name: Cleanup TODOs

on:
  schedule:
    # Run every Friday at 10:00 UTC
    - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt (optional — overrides default)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-todos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: davd-gzl/Prompt2PR@v1
        with:
          prompt: >-
            ${{ github.event.inputs.prompt || 'Find all TODO, FIXME, HACK, and
            XXX comments in the source code. For each one, read the surrounding
            code to determine if the described task has already been
            implemented. If the TODO is clearly resolved by the surrounding
            code, remove the comment. Leave unresolved TODOs in place. Do not
            change any code — only add or remove comments.' }}
          provider: 'anthropic'
          paths: 'src/**,lib/**'
          max_files: 10
          max_changes: 200
          label: 'prompt2pr,cleanup'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
