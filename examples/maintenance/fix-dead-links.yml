# Fix Dead Links — Prompt2PR Example Workflow
#
# Scans markdown files for broken or suspicious links and fixes them.
# The LLM uses its training knowledge to identify URLs that are likely
# broken — known-dead domains, obviously malformed URLs, outdated
# versioned documentation paths, and relative links that don't match
# files in the repository.
#
# Note: The LLM cannot make live HTTP requests to verify URLs at runtime.
# It relies on pattern recognition and training knowledge. For thorough
# link checking, pair this with a dedicated link-checker tool.
#
# Setup:
#   1. Copy this file to .github/workflows/fix-dead-links.yml
#   2. Set your LLM provider API key as a GitHub Secret
#   3. Adjust the cron schedule and paths as needed

name: Fix Dead Links

on:
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt (optional — overrides default)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: davd-gzl/Prompt2PR@v1
        with:
          prompt: >-
            ${{ github.event.inputs.prompt || 'Scan all markdown files for links
            that are likely broken: malformed URLs (missing protocol, typos in
            domain names), links to known-dead domains or services, relative
            links that do not match any file in the repository, and versioned
            documentation URLs that appear outdated. For each issue, either
            update the URL to the correct destination or remove the link with a
            brief note explaining why. Do not change any other content.' }}
          provider: 'mistral'
          paths: '**/*.md'
          max_files: 10
          max_changes: 200
          label: 'prompt2pr,dead-links'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
