title: Prompt2PR
description: >-
  A GitHub Action that turns prompts into Pull Requests using LLMs.
remote_theme: 'mmistakes/minimal-mistakes@4.26.2'
url: https://davd-gzl.github.io/Prompt2PR

minimal_mistakes_skin: 'default'

# Site author (shown in sidebar)
author:
  name: 'Prompt2PR'
  bio: 'Turn prompts into Pull Requests using LLMs.'
  links:
    - label: 'GitHub'
      icon: 'fab fa-fw fa-github'
      url: 'https://github.com/davd-gzl/Prompt2PR'

# Reading
encoding: 'utf-8'

# Build
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-include-cache

# Defaults — apply sidebar nav + layout to all pages
defaults:
  - scope:
      path: ''
      type: 'pages'
    values:
      layout: 'single'
      sidebar:
        nav: 'docs'

# Footer
footer:
  links:
    - label: 'GitHub'
      icon: 'fab fa-fw fa-github'
      url: 'https://github.com/davd-gzl/Prompt2PR'

# Exclude files that shouldn't be processed by Jekyll
exclude:
  - node_modules/
  - dist/
  - coverage/
  - __tests__/
  - __fixtures__/
  - src/
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.mjs'
  - Gemfile
  - Gemfile.lock
