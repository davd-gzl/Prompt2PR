# See: https://github.com/DavidAnson/markdownlint

# Unordered list style
MD004:
  style: dash

# Relax line-length: ignore tables, code blocks, headings, and long links
MD013:
  tables: false
  code_blocks: false
  headings: false

# Allow duplicate headings under different parents (e.g. ### Setup per provider)
MD024:
  siblings_only: true

# Allow Jekyll front matter title + body H1
MD025: false

# Ordered list item prefix — allow 1/2/3 style
MD029:
  style: ordered

# Spaces after list markers
MD030:
  ul_single: 1
  ol_single: 1
  ul_multi: 1
  ol_multi: 1

# Code block style
MD046:
  style: fenced
