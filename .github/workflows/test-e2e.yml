name: E2E Test
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What should the AI fix?'
        required: false
        default: 'Find and fix any typos or grammar issues in README.md'

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  test-prompt2pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          prompt: ${{ github.event.inputs.prompt }}
          provider: openai
          model: gpt-4o
          paths: 'README.md'
          max_files: 5
          max_changes: 100
          base_url: https://models.inference.ai.azure.com
        env:
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
