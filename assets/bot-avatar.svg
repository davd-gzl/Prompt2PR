<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#6f42c1" stroke="#5a32a3" stroke-width="2"/>

  <!-- Bot head (rounded rectangle) -->
  <rect x="30" y="28" width="60" height="50" rx="12" ry="12" fill="#fff"/>

  <!-- Eyes -->
  <circle cx="45" cy="50" r="7" fill="#6f42c1"/>
  <circle cx="75" cy="50" r="7" fill="#6f42c1"/>

  <!-- Eye highlights -->
  <circle cx="47" cy="48" r="2.5" fill="#fff"/>
  <circle cx="77" cy="48" r="2.5" fill="#fff"/>

  <!-- Mouth (smile) -->
  <path d="M 44 62 Q 60 74 76 62" fill="none" stroke="#6f42c1" stroke-width="3" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="60" y1="28" x2="60" y2="16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="14" r="4" fill="#fff"/>

  <!-- Git merge icon on antenna tip -->
  <circle cx="60" cy="14" r="2" fill="#6f42c1"/>

  <!-- Body hint -->
  <rect x="40" y="80" width="40" height="16" rx="6" ry="6" fill="#fff"/>

  <!-- Body detail lines -->
  <line x1="50" y1="84" x2="50" y2="92" stroke="#6f42c1" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="84" x2="60" y2="92" stroke="#6f42c1" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="84" x2="70" y2="92" stroke="#6f42c1" stroke-width="2" stroke-linecap="round"/>
</svg>
